name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q dataforge tests
      - name: Run deterministic tests (offline)
        run: python -m unittest discover -s tests -v

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: dataforge_ci
          POSTGRES_USER: dataforge_ci
          POSTGRES_PASSWORD: local-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataforge_ci -d dataforge_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATAFORGE_TEST_DATABASE_URL: postgresql://dataforge_ci:local-ci-test-only@localhost:5432/dataforge_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PostgreSQL adapter
        run: python -m pip install -r requirements-warehouse.txt
      - name: Verify PostgreSQL insert, replay and update
        run: python -m unittest discover -s tests -p 'test_warehouse_integration.py' -v
