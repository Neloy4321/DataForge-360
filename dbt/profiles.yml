# Local CLI configuration. Never hard-code or commit database secrets.
dataforge_360:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('DBT_PORT', '55432') | as_number }}"
      user: "{{ env_var('DBT_USER', 'dataforge') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'dataforge') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 2

